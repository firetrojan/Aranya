    attribution_required: true
    attribution_text: >-
      "Contains modified Copernicus Sentinel data (year), processed by Aranya."
    redistribution: permitted_with_attribution
    authentication: >-
      Catalogue STAC/OData search was REACHABLE WITHOUT a key on 2026-10-10.
      Product download normally requires a free account.
    rate_limits: not documented publicly
    update_frequency: continuous satellite revisit
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: investigating
    probe_evidence: data-pipeline/tests/probe_api_shapes.py::copernicus_stac
    limitations: >-
      The catalogue OData path returned HTTP 404 at `/odata/v1/Products` while the
      STAC endpoint `/stac/collections` returned HTTP 200 with a full collection list.
      Catalogue access works; the OData path needs the correct route. Real
      constraint is size: Sentinel imagery is hundreds of MB per scene, which is
      incompatible with the small-footprint goal. Stage 01 must NOT bundle imagery.
      Aranya must carry the "Contains modified Copernicus Sentinel data" credit.
    fallback: isro_bhoonidhi (registered, investigating)

