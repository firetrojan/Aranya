# Aranya agricultural source registry
#
# THIS FILE IS A VERIFIED-STATUS LEDGER, NOT A LIST OF THINGS THAT WORK.
#
# Status vocabulary (also enforced by data-pipeline/tests/test_sources_registry.py):
#   verified      - endpoint reached, licence/terms read, response shape confirmed on the
#                  `verified_on` date below.
#   investigating - endpoint reachable but licence, terms, or required parameters not yet
#                  confirmed, so the data is not safe to build on.
#   restricted    - known to exist and be authoritative, but access requires registration,
#                  a key, a paid tier, or a negotiated agreement.
#   unavailable   - endpoint probed and failed (DNS, connection, or HTTP error).
#   not_integrated- candidate recorded for future stages; access deliberately not assessed
#                  yet, or a replacement is planned.
#
# Honesty rules applied here:
#   * "verified" means we got a real HTTP response AND read the licence/terms text.
#     It does NOT mean the data is fit for a farmer-level decision; see `limitations`.
#   * A source with an unresolved licence question is NOT marked verified.
#   * Every `last_success` value below is an actual probe result, never a guess.
#   * `restricted` never becomes a hard build dependency. See docs/ARCHITECTURE.md.

registry_version: 1
updated_on: "2026-10-10"
default_geography:
  id: in
  name: India
  note: >-
    India-wide defaults. A future pilot state or district must be selectable via
    `geography` without restructuring the app; every adapter reads its region from
    configuration, never from hardcoded constants.

categories:
  weather: Weather, forecast and agrometeorological advisories
  climate: Historical environmental and climate series
  soil: Soil properties, soil classification and soil test records
  market: Mandi / regulated market prices
  statistics: Official crop production and agricultural statistics
  satellite: Satellite and Earth observation products
  policy: Agricultural policy, trade, export and scheme documents
  geo: Geographic base data, boundaries and place names

sources:

  # ---------------------------------------------------------------- weather ---

  - id: open_meteo_forecast
    name: Open-Meteo Forecast API
    official_url: https://open-meteo.com/
    api_url: https://api.open-meteo.com/v1/forecast
    access_method: rest_json_no_key
    category: weather
    geography: global_including_india
    licence: CC-BY 4.0 (data); free API tier restricted to NON-COMMERCIAL use
    attribution_required: true
    attribution_text: "Weather data by Open-Meteo.com"
    redistribution: >-
      Displaying fetched values to the end user with attribution is acceptable.
      Bundling a bulk offline copy of provider data into the APK is NOT
      contemplated and would breach the size and licensing goals.
    authentication: none on free tier
    rate_limits: >-
      Free tier: <10,000 calls/day, 5,000/hour, 600/minute. Attribution mandatory.
    update_frequency: hourly model runs
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: verified
    probe_evidence: data-pipeline/tests/probe_api_shapes.py::open_meteo_full
    limitations: >-
      Model output, not an official Indian meteorological product. Grid resolution
      is far coarser than a field, so this is a fallback and trend source, NOT the
      authority for warnings in India.
      CRITICAL COMMERCIAL RISK: the free tier is non-commercial only. If Aranya ever
      gains ads, subscriptions, or paid distribution, this adapter MUST be swapped for
      a paid plan or replaced. Tracked in docs/LICENCES.md.
    fallback: nasa_power (historical context), imd_api (official, restricted)

  - id: open_meteo_air_quality
    name: Open-Meteo Air Quality API
    official_url: https://open-meteo.com/en/docs/air-quality-api
    api_url: https://air-quality-api.open-meteo.com/v1/air-quality
    access_method: rest_json_no_key
    category: weather
    geography: global_including_india
    licence: CC-BY 4.0 (data); free tier NON-COMMERCIAL only
    attribution_required: true
    redistribution: display_only_with_attribution
    authentication: none on free tier
    rate_limits: shared with the Open-Meteo free-tier accounting
    update_frequency: hourly
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: verified
    probe_evidence: data-pipeline/tests/probe_api_shapes2.py::openmeteo_air_quality
    limitations: >-
      Same non-commercial restriction as the forecast API. CAMS-based model output
      is coarse; not suitable for a field-level air quality claim.
    fallback: no alternative planned in stage 01

  - id: imd_api
    name: India Meteorological Department API
    official_url: https://mausam.imd.gov.in/
    api_url: https://api.imd.gov.in/
    access_method: rest_json_api_key_required
    category: weather
    geography: india
    licence: >-
      Government of India content. Free for registered non-commercial users, but the
      precise terms text was NOT retrieved and must be read and recorded before use.
    attribution_required: true
    attribution_text: "Source: India Meteorological Department"
    redistribution: >-
      UNCONFIRMED. Must not be cached or redistributed until terms are read.
    authentication: >-
      REQUIRED. Registration plus a Development or Production API key, with a JWT
      and server/IP binding.
    rate_limits: governed by issued API key tier; not documented publicly
    update_frequency: multiple times daily
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: restricted
    probe_evidence: data-pipeline/tests/probe_api_shapes.py::imd_api_noauth
    limitations: >-
      Probed unauthenticated endpoints returned HTTP 404 and the portal requires an
      account, so no data was retrieved. This is the authoritative Indian weather
      source and MUST be preferred over model data once an API key exists, but it
      cannot be built on until registration and terms are complete.
    fallback: open_meteo_forecast (clearly labelled as non-official model output)

