  # ------------------------------------------------------------------- soil ---

  - id: isric_soilgrids
    name: ISRIC SoilGrids 2.0
    official_url: https://isric.org/explore/soilgrids
    api_url: https://rest.isric.org/soilgrids/v2.0
    access_method: rest_json_no_key (WMS/WCS/WebDAV also published)
    category: soil
    geography: global_including_india
    licence: CC-BY 4.0
    attribution_required: true
    attribution_text: >-
      "Poggio, L., de Sousa, L. M., Batjes, N. H., Heuvelink, G. B. M., Kempen, B.,
      Ribeiro, E., and Rossiter, D.: SoilGrids 2.0: producing soil information for
      the globe with quantified spatial uncertainty, SOIL, 7, 217-240, 2021."
    redistribution: permitted_with_attribution
    authentication: none
    rate_limits: >-
      Documented fair use: maximum 5 API calls per minute, 500 per day,
      10,000 per month.
    update_frequency: periodic global releases
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: restricted
    probe_evidence: data-pipeline/tests/probe_soilgrids.py
    limitations: >-
      TWO HARD CONSTRAINTS, both confirmed on 2026-10-10:
      (1) The numeric `properties/query` endpoint returned `{"layers": [... "values":
      {"mean": null}]}` or an empty `layers` array at every tested coordinate,
      while `classification/query` returned a real WRB class (e.g. "Luvisols")
      at the same point. SoilGrids' own documentation states the REST API is
      currently PAUSED with issues, so numeric soil values are NOT obtainable
      through it today.
      (2) ISRIC explicitly states SoilGrids "is a global model intended for global
      applications ... we do not advise to use SoilGrids at the local or farm level."
      Aranya must therefore NEVER present a SoilGrids value as a soil test result,
      and must never display it as a measured reading for a farmer's own field.
    fallback: >-
      soil_health_card (restricted, field-level but manual); agricultural university
      lab records; not_integrated ICAR/NBSS&LUP sources in later stages.

  - id: soil_health_card
    name: Soil Health Card Portal (Government of India)
    official_url: https://soilhealth.dac.gov.in/
    api_url: https://soilhealth.dac.gov.in/
    access_method: no_public_api_known_html_portal
    category: soil
    geography: india
    licence: UNCONFIRMED - Government of India portal; no machine-readable licence found
    attribution_required: true
    attribution_text: "Source: Soil Health Card, Government of India"
    redistribution: >-
      UNCONFIRMED. Individual farmer records are personal data. Redistribution of
      farmer-level results is likely restricted and raises privacy obligations.
    authentication: >-
      None found, but no documented API exists. The data is served through a web
      portal with session/OTP interactions.
    rate_limits: not documented
    update_frequency: per crop season, farmer-initiated sampling cycle
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: investigating
    probe_evidence: data-pipeline/tests/probe_api_shapes2.py::soil_health_card
    limitations: >-
      Portal reachable, but there is no documented API and no licence was located.
      Automation risks violating terms and the records are farm-level personal data.
      Field-level laboratory values are the single most valuable soil input for
      Aranya and this remains the key open question for Stage 02.
    fallback: >-
      the farmer enters their own Soil Health Card result (manual entry needs no
      redistribution of government records); this is not a registered source.

  - id: icar_soil_atlas_india
    name: ICAR / NBSS&LUP Indian soil resources
    official_url: https://www.nbsslup.in/
    api_url: null
    access_method: not_assessed
    category: soil
