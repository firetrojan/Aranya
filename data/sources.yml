      `licence` field stating the ODbL terms, which the UI must surface.
    authentication: none
    rate_limits: >-
      ABSOLUTE MAXIMUM 1 request per second. Bulk geocoding is prohibited and the
      service may be blocked. A commercial app needs an agreement.
    update_frequency: continuous
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: verified
    probe_evidence: data-pipeline/tests/probe_api_shapes.py::nominatim_search
    limitations: >-
      Strict 1 req/s policy. Only usable for occasional place lookup, never for
      autocomplete on every keystroke, and never for bulk geocoding. Place names
      are transliterated to Latin script, so Indian script place names will need
      the user's own script and local-language administrative data alongside.
    fallback: packaged India administrative boundary list (planned, offline; not yet a
      registered source)

  - id: osm_overpass
    name: OpenStreetMap Overpass API
    official_url: https://overpass-api.de/
    api_url: https://overpass-api.de/api/interpreter
    access_method: rest_query_post
    category: geo
    geography: global_including_india
    licence: ODbL 1.0
    attribution_required: true
    attribution_text: "© OpenStreetMap contributors"
    redistribution: >-
      Overpass output is OSM data under ODbL. Provenance and attribution must be
      preserved on any stored result.
    authentication: none
    rate_limits: >-
      Endpoint status reported "Rate limit: 4, 4 slots available now". Mirrors
      exist; self-hosting is the sanctioned answer to heavy use.
    update_frequency: continuous
    last_success: "2026-10-10"
    verified_on: "2026-10-10"
    status: verified
    probe_evidence: data-pipeline/tests/probe_api_shapes.py::overpass_query
    limitations: >-
      The verified market query returned HTTP 200 with a well-formed response but an
      EMPTY `elements` array, so no OSM-tagged marketplaces matched that small test
      bounding box. That is a coverage finding, not a failure: OSM coverage of
      Indian agri infrastructure is uneven, so a result may be absent rather than
      negative. Shared public endpoints are not a production dependency.
    fallback: >-
      a self-hosted or dedicated Overpass instance (not a registered source yet);
      official mandi lists from AGMARKNET for actual market locations.

  - id: osm_tiles
    name: OpenStreetMap tile servers (raster + vector)
    official_url: https://operations.osmfoundation.org/policies/tiles/
    api_url: https://tile.openstreetmap.org/
    access_method: tile_raster_and_shortbread_vector
    category: geo
    geography: global_including_india
    licence: ODbL 1.0 (data); tile SERVICE use is governed by OSMF policy
    attribution_required: true
    attribution_text: "© OpenStreetMap contributors"
    redistribution: >-
      PROHIBITED in the way a naive offline map would do it. Both the raster and
      vector tile policies state: "Bulk downloading ('scraping') is the downloading
      of tiles in advance instead of downloading when a user views those tiles ...
      creating a tile archive or downloading for offline usage. Bulk downloading
      is prohibited." Also required: visible attribution, a valid identifying
      HTTP User-Agent, no no-cache headers, and HTTP caching honoured (minimum 7 days).
    authentication: none
    rate_limits: best effort, no SLA; blocking without notice is explicitly allowed
    update_frequency: continuous
    last_success: null
    verified_on: "2026-10-10"
    status: restricted
    probe_evidence: docs/LICENCES.md (policy text read 2026-10-10)
    limitations: >-
      DIRECT CONFLICT WITH ARANYA'S OFFLINE-FIRST GOAL, resolved deliberately:
      Aranya may display OSM tiles online with attribution, and MAY cache them
      according to HTTP cache headers, but it will NOT implement prefetch or ship
      an offline tile pack from OSMF servers. Offline maps in later stages must use
      a source that grants offline rights explicitly.
    fallback: >-
      a vector tile package with explicit offline licensing, or a self-hosted
      tile stack (switch2osm.org guidance); neither is a registered source yet.

# ---------------------------------------------------------------------------
# Sources deliberately NOT registered, with reasons, so a future contributor
# does not re-add them without thinking.
# ---------------------------------------------------------------------------
excluded_sources:
  - name: Proprietary AI / LLM APIs (OpenAI, Anthropic, Gemini, etc.)
    reason: >-
      Stage 01 constraint: no proprietary AI provider may be a hard dependency, and
      nothing may be embedded in the APK. Any future on-device or remote AI must be
      optional, separately evaluated for size and licence, and off by default.
      See docs/AI_SAFETY.md.
  - name: Paid commercial soil or weather APIs (Soilential, Climate FieldView, etc.)
    reason: Core functionality must remain free with no subscription or account.
  - name: Google Maps / Mapbox / Apple MapKit
    reason: Requires an account, key, and per-request billing. Violates the
      no-paid-API constraint. Use OpenStreetMap instead.
