name: Aranya CI

# Stage 01 could not verify the Android build locally: Gradle requires a glibc-linked
# native library and the development host was aarch64 Android. This workflow is the
# remedy. It runs the host tests that do not need Android, then builds the app and runs
# the Kotlin unit tests on a normal Linux runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Registry honesty, normalization, schemas, WCAG contrast, source policy,
      # Android source consistency and documentation consistency.
      - name: Run host test suite
        run: sh scripts/run_tests.sh

      - name: Verify the registry snapshot is regenerated and clean
        run: |
          python3 data-pipeline/sources/build_snapshot.py
          if ! git diff --quiet -- android/app/src/main/assets/sources_snapshot.json; then
            echo "::error::sources_snapshot.json is stale. Run data-pipeline/sources/build_snapshot.py"
            git diff -- android/app/src/main/assets/sources_snapshot.json
            exit 1
          fi

  android-build:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 fails on current runners: its last step runs
      # `sdkmanager tools`, a subcommand that no longer exists in cmdline-tools 16.0, and
      # the action treats the warning as a hard failure. Licences are accepted and the SDK
      # is installed directly instead, which is also fewer moving parts.
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-key: aranya-gradle

      - name: Generate the Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      # ColorContrastTest and SourcePolicyTest run here. They were written but never
      # executed in Stage 01; this job is where they first run.
      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: warn

      # The release build is what the size budget applies to. Debug is not the number
      # a farmer downloads.
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      # Stage 01 recorded no size figure because no APK was built. This prints the real
      # number so it can be recorded in docs/TEST_PLAN.md.
      - name: Report APK size
        run: |
          set -e
          echo "### APK size" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find android/app/build/outputs/apk -name '*.apk' | while read -r apk; do
            size=$(du -h "$apk" | cut -f1)
            bytes=$(stat -c%s "$apk")
            echo "| \`$(basename "$apk")\` | ${size} | ${bytes} |" >> "$GITHUB_STEP_SUMMARY"
            echo "- $(basename "$apk"): $size ($bytes bytes)"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Budget: release APK under 8 MB (docs/TEST_PLAN.md section 6)." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: aranya-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-key: aranya-gradle

      - name: Generate the Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Run Lint
        working-directory: android
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: warn

# Source availability is checked on a schedule, not on every push. A verified source that
# stops answering must eventually downgrade, otherwise the registry silently becomes false.
  source-probe:
    name: Source availability probe
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe all registered sources
        run: |
          set +e
          python3 data-pipeline/tests/probe_sources.py  > probe_sources.txt 2>&1
          python3 data-pipeline/tests/probe_dns.py     > probe_dns.txt 2>&1
          python3 data-pipeline/tests/probe_soilgrids.py > probe_soilgrids.txt 2>&1

          {
            echo "### Source probe"
            echo ""
            echo "| Source | OK | Status |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          cat probe_sources.txt
          cat probe_dns.txt
          cat probe_soilgrids.txt

          echo ""
          echo "Registry statuses were NOT auto-changed. Review the output above and update"
          echo "data/sources.yml by hand if a source has changed."
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: source-probe
          path: |
            probe_sources.txt
            probe_dns.txt
            probe_soilgrids.txt
          if-no-files-found: warn
